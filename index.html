<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Precios y Márgenes</title>
  
  <!-- Configuración PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- Tailwind CSS para diseño moderno -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen pb-12">

  <!-- Encabezado -->
  <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-50">
    <div class="max-w-3xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold flex items-center gap-2">
        🧮 Calculadora de Precios
      </h1>
      <span class="text-xs bg-blue-700 px-2.5 py-1 rounded-full font-medium">Modo Comerciante 🔒</span>
    </div>
  </header>

  <main class="max-w-3xl mx-auto p-4 space-y-6">

    <!-- Control de Tasa del Día -->
    <div class="bg-amber-50 border border-amber-200 p-4 rounded-xl flex justify-between items-center shadow-sm">
      <div>
        <span class="block text-xs font-semibold text-amber-800">Tasa del día ($ / Bs)</span>
        <span class="text-xs text-amber-600">Ajusta el valor en Bs para el cálculo automático</span>
      </div>
      <input type="number" id="tasa-bcv" value="60.00" step="0.01" onchange="calcularTodo()" class="w-28 p-2 border border-amber-300 rounded-lg text-right font-bold text-amber-900 bg-white outline-none focus:ring-2 focus:ring-amber-500">
    </div>

    <!-- Formulario para fijar costo y márgenes -->
    <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
      <h2 id="titulo-form" class="text-lg font-bold text-slate-900 mb-3">Registrar Producto</h2>
      
      <form id="form-comerciante" onsubmit="guardarProducto(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">Nombre del Producto</label>
          <input type="text" id="com-nombre" required placeholder="Ej. Jarabe para la tos 120ml" class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">Costo Bulto / Caja ($)</label>
            <input type="number" id="com-costo" step="0.01" required placeholder="Ej. 50.00" class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">Unidades x Bulto / Caja</label>
            <input type="number" id="com-unidades" min="1" value="24" required class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm">
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">Ganancia Detal (%)</label>
          <input type="number" id="com-margen-detal" value="35" step="0.01" required class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm">
        </div>

        <div class="flex gap-2 pt-1">
          <button type="submit" id="btn-submit" class="flex-1 bg-slate-900 hover:bg-slate-800 text-white font-medium py-2.5 rounded-lg text-sm transition">
            Guardar y Calcular
          </button>
          <button type="button" id="btn-cancelar" onclick="cancelarEdicion()" class="hidden bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium px-4 py-2.5 rounded-lg text-sm transition">
            Cancelar
          </button>
        </div>
      </form>
    </div>

    <!-- Tabla de Precios Calculados -->
    <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 overflow-x-auto">
      <h3 class="font-bold text-slate-800 mb-3">Precios Sugeridos de Inventario</h3>
      <table class="w-full text-left text-xs text-slate-600">
        <thead class="bg-slate-50 text-slate-700 uppercase">
          <tr>
            <th class="p-2.5">Producto</th>
            <th class="p-2.5">C/U Costo</th>
            <th class="p-2.5">Precio Detal</th>
            <th class="p-2.5 text-center">Acciones</th>
          </tr>
        </thead>
        <tbody id="tabla-precios" class="divide-y divide-slate-100">
          <tr>
            <td colspan="4" class="p-4 text-center text-slate-400 italic">No hay productos registrados</td>
          </tr>
        </tbody>
      </table>
    </div>

  </main>

  <!-- Lógica JavaScript -->
  <script>
    // Variables de Estado
    let inventarioComerciante = [];
    let indiceEdicion = null; // Controla si se está editando un producto

    // Guardar (Crear o Actualizar) Producto
    function guardarProducto(e) {
      e.preventDefault();
      const nombre = document.getElementById('com-nombre').value.trim();
      const costo = parseFloat(document.getElementById('com-costo').value);
      const unidades = parseInt(document.getElementById('com-unidades').value);
      const mDetal = parseFloat(document.getElementById('com-margen-detal').value);

      if (indiceEdicion === null) {
        // Nuevo registro
        inventarioComerciante.push({ nombre, costo, unidades, mDetal });
      } else {
        // Actualizar registro existente
        inventarioComerciante[indiceEdicion] = { nombre, costo, unidades, mDetal };
        cancelarEdicion();
      }

      document.getElementById('form-comerciante').reset();
      document.getElementById('com-unidades').value = "24";
      document.getElementById('com-margen-detal').value = "35";
      calcularTodo();
    }

    // Cargar datos en el formulario para editar
    function editarProducto(index) {
      const item = inventarioComerciante[index];
      document.getElementById('com-nombre').value = item.nombre;
      document.getElementById('com-costo').value = item.costo;
      document.getElementById('com-unidades').value = item.unidades;
      document.getElementById('com-margen-detal').value = item.mDetal;

      indiceEdicion = index;
      document.getElementById('titulo-form').innerText = "Editar Producto";
      document.getElementById('btn-submit').innerText = "Actualizar Producto";
      document.getElementById('btn-cancelar').classList.remove('hidden');
      
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Cancelar la edición actual
    function cancelarEdicion() {
      indiceEdicion = null;
      document.getElementById('form-comerciante').reset();
      document.getElementById('com-unidades').value = "24";
      document.getElementById('com-margen-detal').value = "35";
      document.getElementById('titulo-form').innerText = "Registrar Producto";
      document.getElementById('btn-submit').innerText = "Guardar y Calcular";
      document.getElementById('btn-cancelar').classList.add('hidden');
    }

    // Eliminar producto
    function eliminarProducto(index) {
      if (confirm("¿Estás seguro de que deseas eliminar este producto?")) {
        inventarioComerciante.splice(index, 1);
        if (indiceEdicion === index) cancelarEdicion();
        calcularTodo();
      }
    }

    // Calcular y renderizar tabla
    function calcularTodo() {
      const tasa = parseFloat(document.getElementById('tasa-bcv').value) || 1;
      const tbody = document.getElementById('tabla-precios');

      if (inventarioComerciante.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-slate-400 italic">No hay productos registrados</td></tr>`;
        return;
      }

      tbody.innerHTML = inventarioComerciante.map((item, index) => {
        const costoUnitario = item.costo / item.unidades;
        const precioDetal = costoUnitario * (1 + item.mDetal / 100);

        return `
          <tr class="hover:bg-slate-50">
            <td class="p-2.5 font-medium text-slate-800">${item.nombre}</td>
            <td class="p-2.5">
              $${costoUnitario.toFixed(2)}
              <br><span class="text-slate-400 text-[10px]">Bs ${(costoUnitario * tasa).toFixed(2)}</span>
            </td>
            <td class="p-2.5 text-emerald-600 font-semibold">
              $${precioDetal.toFixed(2)}
              <br><span class="text-emerald-400 text-[10px]">Bs ${(precioDetal * tasa).toFixed(2)}</span>
            </td>
            <td class="p-2.5 text-center space-x-2">
              <button onclick="editarProducto(${index})" class="text-blue-600 hover:text-blue-800 font-medium text-xs bg-blue-50 px-2 py-1 rounded transition">Editar</button>
              <button onclick="eliminarProducto(${index})" class="text-red-600 hover:text-red-800 font-medium text-xs bg-red-50 px-2 py-1 rounded transition">Eliminar</button>
            </td>
          </tr>
        `;
      }).join('');
    }

    // --- REGISTRO DEL SERVICE WORKER PARA PWA ---
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW registrado', reg))
          .catch(err => console.log('Error SW', err));
      });
    }
  </script>
</body>
</html>
